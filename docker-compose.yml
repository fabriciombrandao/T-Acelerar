name: winthor-data-deploy
# Nome explícito do projeto Compose — evita qualquer ambiguidade/colisão
# com outras stacks já rodando no mesmo VPS (ex: TNORTEANDO). Sem isso,
# o nome do projeto seria inferido do nome da pasta, o que é frágil.

# Perfil "compartilhado" (>1 consultor, volume grande): Postgres obrigatório
# (não SQLite), Redis + worker Celery obrigatórios (não processamento
# síncrono na requisição). Ver README.md para o racional dessas decisões.
#
# LIMITES DE RECURSO SÃO DELIBERADOS: este VPS roda outra aplicação de
# produção (TNORTEANDO). Os limites abaixo existem para que um import
# grande no Winthor Data Deploy NUNCA consuma recurso a ponto de afetar
# a outra aplicação. Ajuste os valores conforme a capacidade real do VPS
# (ver README.md, seção "Ambiente compartilhado" para como medir antes).

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8420}:8000"
    environment:
      WINTHOR_DB_URL: postgresql+psycopg2://winthor:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@db:5432/winthor_data_deploy
      WINTHOR_JWT_SECRET: ${WINTHOR_JWT_SECRET:?defina WINTHOR_JWT_SECRET no .env}
      WINTHOR_BOOTSTRAP_SECRET: ${WINTHOR_BOOTSTRAP_SECRET:-}
      WINTHOR_REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
    volumes:
      - winthor_output:/app/output
    mem_limit: ${APP_MEM_LIMIT:-512m}
    cpus: ${APP_CPU_LIMIT:-1.0}

  worker:
    build: .
    restart: unless-stopped
    command: celery -A app.tasks worker --loglevel=info --concurrency=${WORKER_CONCURRENCY:-2} --app-dir /app/backend
    environment:
      WINTHOR_DB_URL: postgresql+psycopg2://winthor:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@db:5432/winthor_data_deploy
      WINTHOR_REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
    volumes:
      - winthor_output:/app/output
    # É este serviço que processa os imports grandes — o candidato natural
    # a consumir recurso demais se ficar sem teto. Concurrency baixa por
    # padrão (2) de propósito: prioriza não incomodar o vizinho sobre
    # velocidade máxima de processamento.
    mem_limit: ${WORKER_MEM_LIMIT:-1g}
    cpus: ${WORKER_CPU_LIMIT:-1.5}

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 200mb --maxmemory-policy allkeys-lru
    volumes:
      - winthor_redis:/data
    mem_limit: 256m
    cpus: 0.5

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: winthor_data_deploy
      POSTGRES_USER: winthor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - winthor_postgres:/var/lib/postgresql/data
    mem_limit: ${DB_MEM_LIMIT:-512m}
    cpus: ${DB_CPU_LIMIT:-1.0}

volumes:
  winthor_postgres:
  winthor_redis:
  winthor_output:
