version: "3.9"

# Perfil "compartilhado" (>1 consultor): Postgres é obrigatório, não opcional.
# SQLite trava com escrita concorrente de vários consultores ao mesmo tempo.

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      WINTHOR_DB_URL: postgresql+psycopg2://winthor:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@db:5432/winthor_data_deploy
      WINTHOR_JWT_SECRET: ${WINTHOR_JWT_SECRET:?defina WINTHOR_JWT_SECRET no .env}
      WINTHOR_BOOTSTRAP_SECRET: ${WINTHOR_BOOTSTRAP_SECRET:-}
    depends_on:
      - db
    volumes:
      - winthor_output:/app/output

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: winthor_data_deploy
      POSTGRES_USER: winthor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - winthor_postgres:/var/lib/postgresql/data

volumes:
  winthor_postgres:
  winthor_output:
