<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T-Acelerar — Winthor</title>

<script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
<script src="https://unpkg.com/lucide@latest"></script>

<style>
  /* ======================================================================
     1. DESIGN SYSTEM (VARIAVEIS) - unica fonte de cor/espacamento do app.
     Nunca usar cor/raio/sombra hardcoded fora daqui. Ver docs/FRONTEND_GUIDELINES.md.
     ====================================================================== */
  :root {
    --bg-principal: #f8fafc;
    --bg-card: #ffffff;
    --border-color: #e2e8f0;

    --texto-principal: #0f172a;
    --texto-secundario: #475569;
    --texto-terciario: #94a3b8;

    --cor-marca: #2563eb;
    --cor-marca-hover: #1d4ed8;
    --cor-marca-soft: #eff6ff;

    --cor-sucesso: #16a34a;
    --cor-sucesso-soft: #f0fdf4;
    --cor-erro: #dc2626;
    --cor-erro-soft: #fef2f2;
    --cor-aviso: #d97706;
    --cor-aviso-soft: #fffbeb;
    --cor-bloqueio: #7f1d1d;
    --cor-bloqueio-soft: #fee2e2;

    --radius-md: 8px;
    --radius-sm: 4px;
    --shadow-sm: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
    --shadow-md: 0 4px 12px -2px rgb(0 0 0 / 0.12);

    --sidebar-width: 264px;
  }

  /* ======================================================================
     2. RESET & BASE
     ====================================================================== */
  * { box-sizing: border-box; margin: 0; padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

  body {
    background-color: var(--bg-principal);
    color: var(--texto-principal);
    font-size: 13.5px;
    line-height: 1.5;
  }

  button, input, select { font: inherit; color: inherit; }
  [x-cloak] { display: none !important; }

  /* ======================================================================
     3. LAYOUT GLOBAL
     ====================================================================== */
  .app-shell { display: grid; grid-template-columns: var(--sidebar-width) 1fr; min-height: 100vh; }

  .sidebar {
    background: var(--bg-card);
    border-right: 1px solid var(--border-color);
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
  }

  .sidebar-header { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
  .sidebar-header h1 { font-size: 15px; font-weight: 600; }
  .sidebar-subtitle { color: var(--texto-secundario); font-size: 11.5px; margin-bottom: 20px; }

  .nav-tabs { display: flex; gap: 4px; margin-bottom: 16px; background: var(--bg-principal);
              border-radius: var(--radius-md); padding: 3px; }
  .nav-tabs button {
    flex: 1; border: none; background: transparent; padding: 7px 8px;
    border-radius: var(--radius-sm); font-size: 12px; font-weight: 500;
    color: var(--texto-secundario); cursor: pointer; transition: all 0.2s ease;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .nav-tabs button.active { background: var(--bg-card); color: var(--cor-marca); box-shadow: var(--shadow-sm); }
  .nav-tabs button:hover:not(.active) { color: var(--texto-principal); }

  .project-list { list-style: none; flex: 1; overflow-y: auto; }
  .project-item {
    display: flex; align-items: center; gap: 8px; padding: 9px 10px;
    border-radius: var(--radius-sm); cursor: pointer; transition: all 0.2s ease;
    font-size: 13px; color: var(--texto-principal);
  }
  .project-item:hover { background: var(--bg-principal); }
  .project-item.active { background: var(--cor-marca-soft); color: var(--cor-marca-hover); font-weight: 600; }


  .sidebar-footer {
    margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border-color);
    display: flex; align-items: center; justify-content: space-between;
  }
  .user-chip { font-size: 12px; }

  main.content { padding: 28px 36px; overflow-y: auto; max-width: 960px; }

  .empty-state { padding-top: 60px; max-width: 42ch; color: var(--texto-secundario); }
  .empty-state h2 { color: var(--texto-principal); font-size: 17px; margin-bottom: 8px; }

  section.panel { margin-bottom: 28px; }
  section.panel > h2 {
    font-size: 14.5px; font-weight: 600; padding-bottom: 8px;
    border-bottom: 1px solid var(--border-color); margin-bottom: 14px;
    display: flex; align-items: center; gap: 8px;
  }

  /* ======================================================================
     4. COMPONENTES
     ====================================================================== */

  input[type=text], input[type=email], input[type=password], input[type=file], select {
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    padding: 8px 10px;
    background: var(--bg-card);
    transition: all 0.2s ease;
  }
  input:focus-within, input:focus, select:focus {
    outline: none; border-color: var(--cor-marca);
    box-shadow: 0 0 0 3px var(--cor-marca-soft);
  }

  button.btn-primary {
    background: var(--cor-marca); color: #fff; border: none;
    padding: 9px 16px; border-radius: var(--radius-sm); font-weight: 600; font-size: 12.5px;
    cursor: pointer; transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 6px;
  }
  button.btn-primary:hover { background: var(--cor-marca-hover); }
  button.btn-primary:disabled { background: var(--texto-terciario); cursor: not-allowed; }

  button.btn-ghost {
    background: var(--bg-card); border: 1px solid var(--border-color);
    color: var(--texto-principal); padding: 7px 12px; border-radius: var(--radius-sm);
    font-size: 12px; cursor: pointer; transition: all 0.2s ease;
    display: inline-flex; align-items: center; gap: 6px;
  }
  button.btn-ghost:hover { border-color: var(--cor-marca); color: var(--cor-marca-hover); }

  button.btn-danger-ghost { color: var(--cor-erro); border-color: var(--border-color); }
  button.btn-danger-ghost:hover { border-color: var(--cor-erro); background: var(--cor-erro-soft); }

  button.icon-btn {
    background: none; border: none; cursor: pointer; color: var(--texto-secundario);
    padding: 6px; border-radius: var(--radius-sm); transition: all 0.2s ease;
    display: inline-flex; align-items: center; justify-content: center;
  }
  button.icon-btn:hover { background: var(--bg-principal); color: var(--texto-principal); }

  .card {
    background: var(--bg-card); border: 1px solid var(--border-color);
    border-radius: var(--radius-md); padding: 16px;
  }
  .upload-zone {
    display: flex; align-items: center; gap: 14px; padding: 18px;
    border: 1.5px dashed var(--border-color); border-radius: var(--radius-md);
    background: var(--bg-card); transition: all 0.2s ease;
  }
  .upload-zone:focus-within { border-color: var(--cor-marca); }

  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
  .stat-box {
    background: var(--bg-card); border: 1px solid var(--border-color);
    border-radius: var(--radius-md); padding: 12px 14px;
  }
  .stat-box .value { font-size: 20px; font-weight: 700; color: var(--texto-principal); }
  .stat-box .label { font-size: 11px; color: var(--texto-secundario); margin-top: 2px; }

  .batch-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 14px; background: var(--bg-card); border: 1px solid var(--border-color);
    border-radius: var(--radius-md); margin-bottom: 8px; transition: all 0.2s ease;
  }
  .batch-row:hover { box-shadow: var(--shadow-sm); }
  .batch-row .filename { font-weight: 600; font-size: 13px; }
  .batch-row .meta { color: var(--texto-secundario); font-size: 11.5px; margin-top: 2px; }

  .status-pill {
    display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 600;
    padding: 2px 8px; border-radius: 10px; text-transform: uppercase; letter-spacing: 0.02em;
  }
  .status-pill.status-DONE { background: var(--cor-sucesso-soft); color: var(--cor-sucesso); }
  .status-pill.status-PENDING, .status-pill.status-PROCESSING { background: var(--cor-aviso-soft); color: var(--cor-aviso); }
  .status-pill.status-FAILED { background: var(--cor-erro-soft); color: var(--cor-erro); }

  .exception-row {
    display: grid; grid-template-columns: 92px 1fr auto; gap: 14px; align-items: center;
    padding: 12px 14px; background: var(--bg-card); border: 1px solid var(--border-color);
    border-left-width: 4px; border-radius: var(--radius-md); margin-bottom: 8px;
    transition: all 0.2s ease;
  }
  .exception-row:hover { box-shadow: var(--shadow-sm); }
  .exception-row.sev-BLOCKER { border-left-color: var(--cor-bloqueio); }
  .exception-row.sev-HIGH { border-left-color: var(--cor-erro); }
  .exception-row.sev-MEDIUM { border-left-color: var(--cor-aviso); }
  .exception-row.sev-LOW { border-left-color: var(--border-color); }
  .exception-row.resolved { opacity: 0.45; }

  .sev-tag { font-size: 10.5px; font-weight: 700; letter-spacing: 0.02em; }
  .sev-BLOCKER .sev-tag { color: var(--cor-bloqueio); }
  .sev-HIGH .sev-tag { color: var(--cor-erro); }
  .sev-MEDIUM .sev-tag { color: var(--cor-aviso); }
  .sev-LOW .sev-tag { color: var(--texto-terciario); }

  .exception-body .reason { font-weight: 600; margin-right: 8px; font-size: 12.5px; }
  .exception-body .desc { color: var(--texto-secundario); font-size: 12.5px; }
  .exception-body .status-line { display: block; margin-top: 3px; font-size: 11px; color: var(--cor-marca); }
  .exception-actions { display: flex; gap: 6px; }

  .pagination-bar {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 10px; font-size: 12px; color: var(--texto-secundario);
  }

  .wizard-select-row { display: flex; gap: 10px; margin: 14px 0; }
  .module-check {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    background: var(--bg-card); border: 1px solid var(--border-color);
    border-radius: var(--radius-sm); margin-bottom: 6px; cursor: pointer;
  }
  .module-check input { cursor: pointer; }

  .user-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px; background: var(--bg-card); border: 1px solid var(--border-color);
    border-radius: var(--radius-md); margin-bottom: 6px;
  }
  .role-badge {
    font-size: 10.5px; font-weight: 600; padding: 2px 8px; border-radius: 10px;
    text-transform: uppercase; background: var(--cor-marca-soft); color: var(--cor-marca-hover);
  }

  .login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-card {
    width: 300px; padding: 32px; background: var(--bg-card);
    border: 1px solid var(--border-color); border-radius: var(--radius-md); box-shadow: var(--shadow-md);
    display: flex; flex-direction: column; gap: 10px;
  }
  .login-card h1 { font-size: 17px; margin-bottom: 2px; }
  .login-card .sidebar-subtitle { margin-bottom: 12px; }
  .login-error { color: var(--cor-erro); font-size: 12px; min-height: 14px; }

  .toast {
    position: fixed; bottom: 24px; right: 24px; background: var(--texto-principal); color: #fff;
    padding: 10px 16px; border-radius: var(--radius-sm); font-size: 12.5px; max-width: 340px;
    box-shadow: var(--shadow-md); display: flex; align-items: center; gap: 8px;
  }

  .form-grid { display: flex; flex-direction: column; gap: 10px; max-width: 420px; }
  .field-label { font-size: 12px; font-weight: 600; color: var(--texto-secundario); margin-bottom: -4px; }
  .note-text { font-size: 12px; color: var(--texto-secundario); }
  .note-text.blocked { color: var(--cor-bloqueio); }
</style>
</head>
<body x-data="app()" x-init="init()">

<div class="login-screen" x-show="!token" x-cloak>
  <form class="login-card" x-on:submit.prevent="login()">
    <h1>T-Acelerar</h1>
    <div class="sidebar-subtitle">Acelerador de projetos de implantacao</div>
    <input type="email" x-model="loginForm.email" placeholder="Email" required autocomplete="username">
    <input type="password" x-model="loginForm.password" placeholder="Senha" required autocomplete="current-password">
    <button type="submit" class="btn-primary" style="justify-content:center;">Entrar</button>
    <div class="login-error" x-text="loginError"></div>
  </form>
</div>

<div class="app-shell" x-show="token" x-cloak>

  <aside class="sidebar">
    <div class="sidebar-header">
      <i data-lucide="layers" style="width:18px;height:18px;color:var(--cor-marca);"></i>
      <h1>T-Acelerar</h1>
    </div>
    <div class="sidebar-subtitle" x-text="me ? me.name + ' - ' + me.role : ''"></div>

    <nav class="nav-tabs">
      <button x-on:click="view = 'projects'" x-bind:class="{active: view === 'projects'}">
        <i data-lucide="folder" style="width:14px;height:14px;"></i> Projetos
      </button>
      <button x-show="me && me.role !== 'analista'" x-on:click="view = 'team'; loadTeam()" x-bind:class="{active: view === 'team'}">
        <i data-lucide="users" style="width:14px;height:14px;"></i> Equipe
      </button>
    </nav>

    <template x-if="view === 'projects'">
      <div style="display:flex; flex-direction:column; flex:1; min-height:0;">
        <ul class="project-list">
          <template x-for="p in projects" :key="p.id">
            <li class="project-item" x-bind:class="{active: currentProject && currentProject.id === p.id}"
                x-on:click="isNewProjectFlow = false; selectProject(p)">
              <i data-lucide="building-2" style="width:13px;height:13px;"></i>
              <span x-text="p.name"></span>
            </li>
          </template>
        </ul>
        <button class="btn-ghost" style="width:100%; margin-top:10px; justify-content:center;"
                x-on:click="startNewProjectWizard()">
          <i data-lucide="plus" style="width:14px;height:14px;"></i> Novo projeto
        </button>
      </div>
    </template>

    <div class="sidebar-footer">
      <div class="user-chip">
        <span x-text="me ? me.email : ''"></span>
      </div>
      <div style="display:flex; gap:2px;">
        <button class="icon-btn" x-on:click="showChangePassword = true" title="Trocar senha">
          <i data-lucide="key-round" style="width:16px;height:16px;"></i>
        </button>
        <button class="icon-btn" x-on:click="logout()" title="Sair">
          <i data-lucide="log-out" style="width:16px;height:16px;"></i>
        </button>
      </div>
    </div>
  </aside>

  <!-- ---------- Trocar senha ---------- -->
  <div class="login-screen" style="position:fixed; inset:0; background:rgba(15,23,42,0.4); z-index:50;"
       x-show="showChangePassword" x-cloak>
    <form class="login-card" x-on:submit.prevent="submitChangePassword()">
      <h1 style="font-size:15px;">Trocar senha</h1>
      <input type="password" x-model="changePasswordForm.current_password" placeholder="Senha atual" required autocomplete="current-password">
      <input type="password" x-model="changePasswordForm.new_password" placeholder="Nova senha (mínimo 8 caracteres)" required autocomplete="new-password">
      <input type="password" x-model="changePasswordForm.new_password_confirm" placeholder="Confirmar nova senha" required autocomplete="new-password">
      <div style="display:flex; gap:8px;">
        <button type="submit" class="btn-primary" style="flex:1; justify-content:center;">Salvar</button>
        <button type="button" class="btn-ghost" x-on:click="showChangePassword = false; changePasswordError = ''; changePasswordForm = { current_password: '', new_password: '', new_password_confirm: '' };">Cancelar</button>
      </div>
      <div class="login-error" x-text="changePasswordError"></div>
    </form>
  </div>

  <main class="content">

    <div class="empty-state" x-show="view === 'projects' && !currentProject && !creatingProject">
      <h2>Nenhum projeto selecionado</h2>
      <p>Crie um projeto ao lado (ex: nome do cliente) para comecar: definir o perfil de
      aderencia, subir arquivos, validar automaticamente e tratar excecoes antes de gerar
      o arquivo de carga.</p>
    </div>

    <template x-if="view === 'projects' && creatingProject">
      <section class="panel">
        <h2><i data-lucide="folder-plus" style="width:16px;height:16px;"></i> Novo projeto — passo 1 de 2</h2>
        <div class="form-grid">
          <div class="field-label">Nome do projeto (cliente)</div>
          <input type="text" x-model="newProjectName" placeholder="Ex: Distribuidora Norte" required>

          <div class="field-label">ERP de destino</div>
          <select x-model="newProjectErp">
            <template x-for="erp in erps" :key="erp.id">
              <option :value="erp.id" x-text="erp.name"></option>
            </template>
          </select>

          <div style="display:flex; gap:8px; margin-top:4px;">
            <button class="btn-primary" x-on:click="createProject()" :disabled="!newProjectName.trim()">
              Continuar <i data-lucide="arrow-right" style="width:14px;height:14px;"></i>
            </button>
            <button class="btn-ghost" x-on:click="creatingProject = false;">Cancelar</button>
          </div>
        </div>
      </section>
    </template>

    <template x-if="view === 'projects' && currentProject && !adherence.segment">
      <section class="panel">
        <h2><i data-lucide="clipboard-list" style="width:16px;height:16px;"></i>
          <span x-text="isNewProjectFlow ? 'Novo projeto — passo 2 de 2: perfil de aderencia' : 'Perfil de aderencia pendente'"></span>
          (<span x-text="currentProject.name"></span>)</h2>
        <p class="note-text" style="max-width:60ch; margin-bottom:14px;">
          O layout do Winthor e fixo - isto nao remove campo do arquivo, decide o que e
          exigido como obrigatorio e o que recebe valor padrao automatico.
        </p>

        <div class="wizard-select-row">
          <select x-model="wizardSegment" x-on:change="wizardSubsegment = ''; applyPreset()">
            <option value="">Segmento...</option>
            <template x-for="s in (segmentsConfig ? segmentsConfig.segmentos : [])" :key="s.id">
              <option :value="s.id" x-text="s.nome"></option>
            </template>
          </select>
          <select x-model="wizardSubsegment" x-on:change="applyPreset()">
            <option value="">Subsegmento...</option>
            <template x-for="sub in currentSubsegments()" :key="sub.id">
              <option :value="sub.id" x-text="sub.nome"></option>
            </template>
          </select>
        </div>

        <template x-if="wizardSubsegment">
          <div>
            <template x-for="m in wizardModules()" :key="m.id">
              <label class="module-check">
                <input type="checkbox" x-model="wizardAnswers[m.id]">
                <span x-text="m.pergunta_wizard"></span>
              </label>
            </template>
            <button class="btn-primary" style="margin-top:10px;" x-on:click="saveAdherence()">
              <i data-lucide="check" style="width:14px;height:14px;"></i> Salvar perfil
            </button>
          </div>
        </template>
      </section>
    </template>

    <template x-if="view === 'projects' && currentProject && adherence.segment">
      <div>
        <section class="panel">
          <h2><i data-lucide="clipboard-check" style="width:16px;height:16px;"></i>
            <span x-text="currentProject.name"></span></h2>
          <p class="note-text">
            <span x-text="adherence.segment + ' / ' + adherence.subsegment"></span> -
            modulos ativos:
            <span x-text="activeModuleNames() || 'nenhum (so cadastro basico + fiscal)'"></span>
            &nbsp;
            <a href="#" x-on:click.prevent="adherence = {}" style="color:var(--cor-marca);">editar</a>
          </p>
        </section>

        <section class="panel">
          <h2><i data-lucide="upload-cloud" style="width:16px;height:16px;"></i> Enviar arquivo</h2>
          <div class="upload-zone">
            <input type="file" accept=".csv" x-on:change="uploadFile = $event.target.files[0]">
            <button class="btn-primary" x-on:click="submitUpload()" :disabled="uploading">
              <i data-lucide="upload" style="width:14px;height:14px;"></i>
              <span x-text="uploading ? 'Enviando...' : 'Enviar e validar'"></span>
            </button>
          </div>
        </section>

        <section class="panel">
          <h2><i data-lucide="list" style="width:16px;height:16px;"></i> Lotes importados</h2>
          <div x-show="batches.length === 0" class="note-text">Nenhum lote ainda.</div>
          <template x-for="b in batches" :key="b.id">
            <div class="batch-row">
              <div>
                <div class="filename" x-text="b.source_file"></div>
                <div class="meta">
                  <span class="status-pill" x-bind:class="'status-' + b.status" x-text="b.status"></span>
                  &nbsp;<span x-text="b.total_records"></span> registros -
                  <span x-text="b.exception_count"></span> excecoes -
                  readiness <span x-text="Math.round(b.data_readiness_score * 100)"></span>%
                </div>
              </div>
              <button class="btn-ghost" x-on:click="selectBatch(b)">Abrir</button>
            </div>
          </template>
        </section>

        <template x-if="currentBatch">
          <div>
            <section class="panel">
              <h2><i data-lucide="alert-triangle" style="width:16px;height:16px;"></i> Fila de excecoes</h2>
              <div class="stat-grid" x-show="report">
                <div class="stat-box"><div class="value" x-text="report ? report.total_registros : 0"></div><div class="label">registros</div></div>
                <div class="stat-box"><div class="value" x-text="report ? report.total_excecoes : 0"></div><div class="label">excecoes</div></div>
                <div class="stat-box"><div class="value" x-text="report ? Math.round(report.data_readiness_score * 100) + '%' : '0%'"></div><div class="label">data readiness</div></div>
                <div class="stat-box"><div class="value" x-text="report ? report.excecoes_bloqueantes : 0"></div><div class="label">bloqueantes</div></div>
              </div>

              <div x-show="exceptions.length === 0" class="note-text">Nenhuma excecao nesta pagina.</div>
              <template x-for="ex in exceptions" :key="ex.id">
                <div class="exception-row" x-bind:class="['sev-' + ex.severity, ex.resolution_status !== 'PENDING' ? 'resolved' : '']">
                  <div class="sev-tag" x-text="ex.severity"></div>
                  <div class="exception-body">
                    <span class="reason" x-text="ex.reason_code"></span>
                    <span class="desc" x-text="ex.description"></span>
                    <span class="status-line" x-text="ex.record_id + ' - ' + ex.resolution_status + (ex.resolved_by ? ' - ' + ex.resolved_by : '')"></span>
                  </div>
                  <div class="exception-actions" x-show="ex.resolution_status === 'PENDING'">
                    <button class="btn-ghost" x-on:click="resolveException(ex.id, 'APPROVED')">Aprovar</button>
                    <button class="btn-ghost btn-danger-ghost" x-on:click="resolveException(ex.id, 'REJECTED')">Rejeitar</button>
                  </div>
                </div>
              </template>

              <div class="pagination-bar" x-show="exceptionsTotal > exceptionsLimit">
                <span x-text="'Mostrando ' + (exceptionsOffset + 1) + '-' + Math.min(exceptionsOffset + exceptionsLimit, exceptionsTotal) + ' de ' + exceptionsTotal"></span>
                <div style="display:flex; gap:6px;">
                  <button class="btn-ghost" x-on:click="changeExceptionsPage(-1)" :disabled="exceptionsOffset === 0">Anterior</button>
                  <button class="btn-ghost" x-on:click="changeExceptionsPage(1)" :disabled="exceptionsOffset + exceptionsLimit >= exceptionsTotal">Proxima</button>
                </div>
              </div>
            </section>

            <section class="panel">
              <h2><i data-lucide="file-output" style="width:16px;height:16px;"></i> Arquivo de carga</h2>
              <div class="card" style="display:flex; align-items:center; justify-content:space-between;">
                <div class="note-text" x-bind:class="{blocked: readiness && !readiness.ready_for_dry_run}"
                     x-text="readiness && readiness.ready_for_dry_run
                       ? 'Sem excecoes bloqueantes pendentes. Pronto para gerar o arquivo.'
                       : (readiness ? readiness.pending_blockers + ' excecao(oes) BLOCKER pendente(s). Resolva antes de gerar.' : '')">
                </div>
                <div style="display:flex; gap:8px; align-items:center;">
                  <select x-model="scriptFormat">
                    <option value="texto">Arquivo texto (oficial Winthor)</option>
                    <option value="sql">INSERT Oracle (alternativo)</option>
                  </select>
                  <button class="btn-primary" x-on:click="generateScript()" :disabled="!readiness || !readiness.ready_for_dry_run">
                    <i data-lucide="download" style="width:14px;height:14px;"></i> Gerar
                  </button>
                </div>
              </div>
            </section>
          </div>
        </template>
      </div>
    </template>

    <template x-if="view === 'team'">
      <div>
        <section class="panel">
          <h2><i data-lucide="users" style="width:16px;height:16px;"></i> Equipe</h2>
          <div x-show="teamUsers.length === 0" class="note-text">Nenhum usuario ainda.</div>
          <template x-for="u in teamUsers" :key="u.id">
            <div class="user-row">
              <div>
                <strong x-text="u.name"></strong>
                <span class="note-text" x-text="' - ' + u.email"></span>
              </div>
              <span class="role-badge" x-text="u.role"></span>
            </div>
          </template>
        </section>

        <section class="panel">
          <h2><i data-lucide="user-plus" style="width:16px;height:16px;"></i> Adicionar pessoa</h2>
          <div class="form-grid">
            <input type="text" x-model="newUserForm.name" placeholder="Nome">
            <input type="email" x-model="newUserForm.email" placeholder="Email">
            <input type="password" x-model="newUserForm.password" placeholder="Senha provisoria">

            <template x-if="me && me.role === 'diretor'">
              <div class="field-label">Papel</div>
            </template>
            <template x-if="me && me.role === 'diretor'">
              <select x-model="newUserForm.role">
                <option value="coordenador">Coordenador</option>
                <option value="analista">Analista de servicos</option>
              </select>
            </template>

            <template x-if="me && me.role === 'diretor' && newUserForm.role === 'analista'">
              <div class="field-label">Coordenador responsavel</div>
            </template>
            <template x-if="me && me.role === 'diretor' && newUserForm.role === 'analista'">
              <select x-model="newUserForm.manager_email">
                <option value="">Selecione...</option>
                <template x-for="c in teamUsers.filter(function(u) { return u.role === 'coordenador'; })" :key="c.id">
                  <option :value="c.email" x-text="c.name"></option>
                </template>
              </select>
            </template>

            <p class="note-text" x-show="me && me.role === 'coordenador'">
              Como coordenador, a pessoa criada entra automaticamente na sua equipe como analista.
            </p>

            <button class="btn-primary" style="align-self:flex-start;" x-on:click="createTeamMember()">
              <i data-lucide="check" style="width:14px;height:14px;"></i> Criar
            </button>
          </div>
        </section>
      </div>
    </template>

  </main>
</div>

<div class="toast" x-show="toastMessage" x-cloak x-transition
     x-text="toastMessage"
     x-effect="if (toastMessage) { clearTimeout(toastTimer); toastTimer = setTimeout(function() { toastMessage = ''; }, 3500); }">
</div>

<script>
var API = {
  // Backend agora é container separado do frontend (nginx roteia /api/*
  // pro backend e o resto pro frontend — padrão do time, ver
  // deploy/nginx-*.conf). Toda chamada de API passa por aqui, então o
  // prefixo fica centralizado num lugar só.
  prefix: '/api',

  request: function(path, opts) {
    opts = opts || {};
    var method = opts.method || 'GET';
    var token = opts.token || null;
    var json = opts.json || null;
    var form = opts.form || null;
    var headers = opts.headers || {};

    var finalHeaders = Object.assign({}, headers);
    if (token) finalHeaders['Authorization'] = 'Bearer ' + token;

    var body;
    if (json) { finalHeaders['Content-Type'] = 'application/json'; body = JSON.stringify(json); }
    if (form) { body = form; }

    return fetch(this.prefix + path, { method: method, headers: finalHeaders, body: body }).then(function(resp) {
      if (resp.status === 401) {
        var err = new Error('Sessao expirada.');
        err.unauthorized = true;
        throw err;
      }
      if (!resp.ok) {
        var contentType = resp.headers.get('content-type') || '';
        if (contentType.indexOf('application/json') !== -1) {
          return resp.json().then(function(data) { throw new Error(data.detail || resp.statusText); });
        }
        return resp.text().then(function(text) { throw new Error(text || resp.statusText); });
      }
      return resp;
    });
  },
  get: function(path, token) { return this.request(path, { token: token }); },
  postJson: function(path, json, token) { return this.request(path, { method: 'POST', json: json, token: token }); },
  postForm: function(path, form, token) { return this.request(path, { method: 'POST', form: form, token: token }); },
};

function app() {
  return {
    token: localStorage.getItem('winthor_token') || null,
    me: null,
    loginForm: { email: '', password: '' },
    loginError: '',

    view: 'projects',

    projects: [],
    newProjectName: '',
    newProjectErp: 'winthor',
    erps: [],
    creatingProject: false,
    isNewProjectFlow: false,
    currentProject: null,
    adherence: {},

    segmentsConfig: null,
    modulesConfig: null,
    wizardSegment: '',
    wizardSubsegment: '',
    wizardAnswers: {},

    batches: [],
    uploadFile: null,
    uploading: false,
    currentBatch: null,
    report: null,
    readiness: null,
    scriptFormat: 'texto',

    exceptions: [],
    exceptionsTotal: 0,
    exceptionsOffset: 0,
    exceptionsLimit: 50,

    teamUsers: [],
    newUserForm: { name: '', email: '', password: '', role: 'analista', manager_email: '' },

    toastMessage: '',
    toastTimer: null,

    showChangePassword: false,
    changePasswordForm: { current_password: '', new_password: '', new_password_confirm: '' },
    changePasswordError: '',

    init: function() {
      var self = this;
      if (this.token) {
        this.afterLogin().catch(function() { self.logout(); });
      }
      this.$nextTick(function() { refreshIcons(); });
    },

    login: function() {
      var self = this;
      this.loginError = '';
      var form = new URLSearchParams();
      form.append('username', this.loginForm.email);
      form.append('password', this.loginForm.password);
      return fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: form,
      }).then(function(resp) {
        if (!resp.ok) throw new Error('Email ou senha incorretos.');
        return resp.json();
      }).then(function(data) {
        self.token = data.access_token;
        localStorage.setItem('winthor_token', self.token);
        return self.afterLogin();
      }).catch(function(e) {
        self.loginError = e.message;
      });
    },

    afterLogin: function() {
      var self = this;
      return API.get('/auth/me', this.token).then(function(resp) { return resp.json(); }).then(function(data) {
        self.me = data;
        return self.loadProjects();
      }).then(function() {
        self.$nextTick(function() { refreshIcons(); });
      });
    },

    logout: function() {
      this.token = null;
      this.me = null;
      this.currentProject = null;
      this.currentBatch = null;
      localStorage.removeItem('winthor_token');
    },

    submitChangePassword: function() {
      var self = this;
      this.changePasswordError = '';
      var form = this.changePasswordForm;

      if (form.new_password.length < 8) {
        this.changePasswordError = 'Nova senha precisa ter pelo menos 8 caracteres.';
        return;
      }
      if (form.new_password !== form.new_password_confirm) {
        this.changePasswordError = 'Nova senha e confirmação não coincidem.';
        return;
      }
      if (form.new_password === form.current_password) {
        this.changePasswordError = 'Nova senha precisa ser diferente da senha atual.';
        return;
      }

      return API.postJson('/auth/change-password', form, this.token).then(function() {
        self.showChangePassword = false;
        self.changePasswordForm = { current_password: '', new_password: '', new_password_confirm: '' };
        self.toast('Senha alterada.');
      }).catch(function(e) {
        self.changePasswordError = e.message;
      });
    },

    call: function(promiseFn) {
      var self = this;
      return promiseFn().catch(function(e) {
        if (e.unauthorized) { self.logout(); return null; }
        self.toast('Erro: ' + e.message);
        return null;
      });
    },

    toast: function(msg) { this.toastMessage = msg; },

    loadProjects: function() {
      var self = this;
      return this.call(function() { return API.get('/projects', self.token); }).then(function(resp) {
        if (resp) return resp.json().then(function(data) { self.projects = data; });
      });
    },

    loadErps: function() {
      var self = this;
      if (this.erps.length) return;
      return this.call(function() { return API.get('/erps', self.token); }).then(function(resp) {
        if (resp) return resp.json().then(function(data) {
          self.erps = data;
          if (data.length) self.newProjectErp = data[0].id;
        });
      });
    },

    startNewProjectWizard: function() {
      this.creatingProject = true;
      this.isNewProjectFlow = true;
      this.currentProject = null;
      this.currentBatch = null;
      this.newProjectName = '';
      this.loadErps();
    },

    createProject: function() {
      var self = this;
      if (!this.newProjectName.trim()) return;
      return this.call(function() {
        return API.postJson('/projects', { name: self.newProjectName, erp_type: self.newProjectErp }, self.token);
      }).then(function(resp) {
        if (!resp) return;
        return resp.json().then(function(project) {
          self.newProjectName = '';
          self.creatingProject = false;
          return self.loadProjects().then(function() { self.selectProject(project); });
        });
      });
    },

    selectProject: function(project) {
      var self = this;
      this.creatingProject = false;
      this.currentProject = project;
      this.currentBatch = null;
      this.adherence = {};
      return this.loadAdherence().then(function() { return self.loadBatches(); }).then(function() {
        self.$nextTick(function() { refreshIcons(); });
      });
    },

    loadAdherence: function() {
      var self = this;
      return this.call(function() {
        return API.get('/projects/' + self.currentProject.id + '/adherence', self.token);
      }).then(function(resp) {
        if (!resp) return;
        return resp.json().then(function(data) {
          if (data.segment) {
            self.adherence = data;
          } else {
            self.adherence = {};
            return self.loadWizardConfig();
          }
        });
      });
    },

    loadWizardConfig: function() {
      var self = this;
      if (this.segmentsConfig && this.modulesConfig) return Promise.resolve();
      return Promise.all([
        this.call(function() { return API.get('/adherence/segments', self.token); }),
        this.call(function() { return API.get('/adherence/modules', self.token); }),
      ]).then(function(results) {
        var segResp = results[0], modResp = results[1];
        var jobs = [];
        if (segResp) jobs.push(segResp.json().then(function(d) { self.segmentsConfig = d; }));
        if (modResp) jobs.push(modResp.json().then(function(d) { self.modulesConfig = d; }));
        return Promise.all(jobs);
      });
    },

    currentSubsegments: function() {
      if (!this.segmentsConfig || !this.wizardSegment) return [];
      var seg = this.segmentsConfig.segmentos.find(function(s) { return s.id === this.wizardSegment; }, this);
      return seg ? seg.subsegmentos : [];
    },

    wizardModules: function() {
      if (!this.modulesConfig) return [];
      return this.modulesConfig.modulos.filter(function(m) { return m.pergunta_wizard; });
    },

    applyPreset: function() {
      if (!this.wizardSubsegment) return;
      var sub = this.currentSubsegments().find(function(s) { return s.id === this.wizardSubsegment; }, this);
      this.wizardAnswers = sub ? Object.assign({}, sub.preset) : {};
    },

    saveAdherence: function() {
      var self = this;
      return this.call(function() {
        return API.postJson(
          '/projects/' + self.currentProject.id + '/adherence',
          { segment: self.wizardSegment, subsegment: self.wizardSubsegment, overrides: self.wizardAnswers },
          self.token,
        );
      }).then(function(resp) {
        if (!resp) return;
        return resp.json().then(function(data) {
          self.adherence = data;
          self.toast('Perfil de aderencia salvo.');
          return self.loadBatches();
        });
      });
    },

    activeModuleNames: function() {
      if (!this.adherence.adherence_answers) return '';
      return Object.entries(this.adherence.adherence_answers)
        .filter(function(entry) { return entry[1] === true; })
        .map(function(entry) { return entry[0]; }).join(', ');
    },

    loadBatches: function() {
      var self = this;
      return this.call(function() {
        return API.get('/projects/' + self.currentProject.id + '/imports', self.token);
      }).then(function(resp) {
        if (resp) return resp.json().then(function(data) { self.batches = data; });
      });
    },

    submitUpload: function() {
      var self = this;
      if (!this.uploadFile) { this.toast('Selecione um arquivo CSV.'); return; }
      this.uploading = true;
      var form = new FormData();
      form.append('project_id', this.currentProject.id);
      form.append('file', this.uploadFile);

      return this.call(function() { return API.postForm('/imports', form, self.token); }).then(function(resp) {
        self.uploading = false;
        if (!resp) return;
        return resp.json().then(function(batch) {
          self.uploadFile = null;
          self.toast('Importado: ' + batch.total_records + ' registros, ' + batch.exception_count + ' excecoes.');
          return self.loadBatches().then(function() { return self.selectBatch(batch); });
        });
      });
    },

    selectBatch: function(batch) {
      var self = this;
      this.currentBatch = batch;
      this.exceptionsOffset = 0;
      return Promise.all([this.loadReport(), this.loadExceptions(), this.loadReadiness()]).then(function() {
        self.$nextTick(function() { refreshIcons(); });
      });
    },

    loadReport: function() {
      var self = this;
      return this.call(function() {
        return API.get('/imports/' + self.currentBatch.id + '/report', self.token);
      }).then(function(resp) {
        if (resp) return resp.json().then(function(data) { self.report = data; });
      });
    },

    loadReadiness: function() {
      var self = this;
      return this.call(function() {
        return API.get('/imports/' + self.currentBatch.id + '/readiness', self.token);
      }).then(function(resp) {
        if (resp) return resp.json().then(function(data) { self.readiness = data; });
      });
    },

    loadExceptions: function() {
      var self = this;
      var params = new URLSearchParams({
        batch_id: this.currentBatch.id,
        limit: this.exceptionsLimit,
        offset: this.exceptionsOffset,
      });
      return this.call(function() { return API.get('/exceptions?' + params, self.token); }).then(function(resp) {
        if (!resp) return;
        self.exceptionsTotal = parseInt(resp.headers.get('X-Total-Count') || '0', 10);
        return resp.json().then(function(data) { self.exceptions = data; });
      });
    },

    changeExceptionsPage: function(direction) {
      this.exceptionsOffset = Math.max(0, this.exceptionsOffset + direction * this.exceptionsLimit);
      return this.loadExceptions();
    },

    resolveException: function(id, decision) {
      var self = this;
      return this.call(function() {
        return API.postJson('/exceptions/' + id + '/resolve', { decision: decision }, self.token);
      }).then(function(resp) {
        if (!resp) return;
        self.toast(decision === 'APPROVED' ? 'Excecao aprovada.' : 'Excecao rejeitada.');
        return Promise.all([self.loadExceptions(), self.loadReadiness(), self.loadReport(), self.loadBatches()]);
      });
    },

    generateScript: function() {
      var self = this;
      return fetch('/api/imports/' + this.currentBatch.id + '/script?format=' + this.scriptFormat, {
        headers: { Authorization: 'Bearer ' + this.token },
      }).then(function(resp) {
        if (!resp.ok) {
          return resp.text().then(function(text) { self.toast('Bloqueado: ' + text); });
        }
        var included = resp.headers.get('X-Records-Included');
        var skipped = resp.headers.get('X-Records-Skipped');
        var ext = self.scriptFormat === 'sql' ? 'sql' : 'txt';
        return resp.blob().then(function(blob) {
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = url;
          a.download = 'winthor_carga_' + self.currentBatch.id.slice(0, 8) + '.' + ext;
          a.click();
          URL.revokeObjectURL(url);
          self.toast('Script gerado: ' + included + ' incluidos, ' + skipped + ' ignorados.');
        });
      }).catch(function(e) {
        self.toast('Erro ao gerar script: ' + e.message);
      });
    },

    loadTeam: function() {
      var self = this;
      return this.call(function() { return API.get('/users', self.token); }).then(function(resp) {
        if (resp) return resp.json().then(function(data) { self.teamUsers = data; });
      }).then(function() {
        self.$nextTick(function() { refreshIcons(); });
      });
    },

    createTeamMember: function() {
      var self = this;
      var payload = {
        name: this.newUserForm.name,
        email: this.newUserForm.email,
        password: this.newUserForm.password,
        role: this.me.role === 'coordenador' ? 'analista' : this.newUserForm.role,
      };
      if (payload.role === 'analista' && this.me.role === 'diretor') {
        payload.manager_email = this.newUserForm.manager_email;
      }
      return this.call(function() { return API.postJson('/users', payload, self.token); }).then(function(resp) {
        if (!resp) return;
        self.toast('Pessoa adicionada a equipe.');
        self.newUserForm = { name: '', email: '', password: '', role: 'analista', manager_email: '' };
        return self.loadTeam();
      });
    },
  };
}

function refreshIcons() {
  if (window.lucide) window.lucide.createIcons();
}
</script>
</body>
</html>
