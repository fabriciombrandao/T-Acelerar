# /etc/nginx/sites-available/tacelerar-teste
upstream tacelerar_teste_back  { server 127.0.0.1:8022; keepalive 16; }
upstream tacelerar_teste_front { server 127.0.0.1:3022; keepalive 8;  }

server {
    listen 80;
    server_name teste.servicos.tnorteando.com.br;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name teste.servicos.tnorteando.com.br;

    ssl_certificate     /etc/letsencrypt/live/teste.servicos.tnorteando.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teste.servicos.tnorteando.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    # Maior que o padrao do time (50M) de proposito: import de produto em
    # volume grande (ate ~1M linhas) precisa caber no upload.
    client_max_body_size 200M;

    location /api/ {
        proxy_pass http://tacelerar_teste_back;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location /health {
        proxy_pass http://tacelerar_teste_back;
        proxy_set_header Host $host;
    }
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://tacelerar_teste_back;
        proxy_set_header Host $host;
    }
    location / {
        proxy_pass http://tacelerar_teste_front;
        proxy_set_header Host $host;
    }
}
