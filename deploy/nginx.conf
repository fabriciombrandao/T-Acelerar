# /etc/nginx/sites-available/winthor-data-deploy
# Referência para nginx rodando NO HOST (fora do Docker). Se seu VPS já usa
# um proxy reverso em container (Traefik, nginx-proxy, etc.) para as outras
# aplicações, NÃO use este arquivo — configure via labels/rede Docker
# compartilhada em vez de nginx no host (ver README.md, seção Deploy).

server {
    listen 80;
    server_name winthor-deploy.seudominio.com.br;

    # Volume grande (até ~1M linhas por import): upload em si precisa
    # trafegar rápido; processamento pesado já é assíncrono (Celery), então
    # isso aqui só precisa comportar o tamanho do arquivo, não o tempo de
    # processamento inteiro.
    client_max_body_size 200M;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
