# /etc/nginx/sites-available/winthor-data-deploy
# Ajuste server_name e certificado (recomendo certbot para TLS).

server {
    listen 80;
    server_name winthor-deploy.seudominio.com.br;

    client_max_body_size 25M;  # uploads de CSV/Excel

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
