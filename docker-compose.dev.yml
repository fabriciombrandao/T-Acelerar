name: tacelerar-dev

# Ambiente de DEV. Mesma estrutura do prod, recurso bem mais baixo
# de proposito -- este ambiente nao processa volume grande, e so validacao.
# Se nao estiver em uso ativo, prefira "docker compose -f docker-compose.dev.yml stop"
# em vez de deixar rodando 24/7 (ver README, orcamento de CPU do VPS).

services:
  db:
    image: postgres:16-alpine
    container_name: tacelerar-dev-db
    restart: unless-stopped
    env_file: .env
    volumes:
      - /opt/tacelerar/dev/data/postgres:/var/lib/postgresql/data
    networks: [net-tacelerar-dev]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    cpus: 0.15

  redis:
    image: redis:7-alpine
    container_name: tacelerar-dev-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 100mb --maxmemory-policy allkeys-lru
    volumes:
      - /opt/tacelerar/dev/data/redis:/data
    networks: [net-tacelerar-dev]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
    mem_limit: 128m
    cpus: 0.1

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: tacelerar-backend:dev
    container_name: tacelerar-dev-backend
    restart: unless-stopped
    env_file: .env
    ports: ["127.0.0.1:8021:8000"]
    volumes:
      - /opt/tacelerar/dev/data/uploads:/app/output
      - /opt/tacelerar/dev/logs:/app/logs
    networks: [net-tacelerar-dev]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen(\x27http://localhost:8000/health\x27)"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    mem_limit: 256m
    cpus: 0.25

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: tacelerar-frontend:dev
    container_name: tacelerar-dev-frontend
    restart: unless-stopped
    ports: ["127.0.0.1:3021:80"]
    networks: [net-tacelerar-dev]
    mem_limit: 32m
    cpus: 0.05

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: tacelerar-backend:dev
    container_name: tacelerar-dev-celery-worker
    restart: unless-stopped
    env_file: .env
    command: celery -A app.tasks worker --loglevel=info --concurrency=1
    volumes:
      - /opt/tacelerar/dev/data/uploads:/app/output
      - /opt/tacelerar/dev/logs:/app/logs
    networks: [net-tacelerar-dev]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 384m
    cpus: 0.25

networks:
  net-tacelerar-dev:
    driver: bridge
